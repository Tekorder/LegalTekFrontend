<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LegalTek AI — Legal Assistant</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        /* Tighter border radius — legal/professional feel */
        borderRadius: {
          'none': '0px',
          'sm':   '3px',
          DEFAULT:'4px',
          'md':   '5px',
          'lg':   '7px',
          'xl':   '9px',
          '2xl':  '11px',
          '3xl':  '14px',
          'full': '9999px',
        },
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        },
      },
    };
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Global Styles -->
  <link rel="stylesheet" href="global.css" />

  <!-- React 18 + Babel (no node_modules) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Pin Babel 7: unpkg @latest is Babel 8 and emits `import from "react/jsx-runtime"` (needs a bundler) -->
  <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!--
    FIREBASE — must load before firebase-config.js (plain JS, not Babel).
    Login screen: Root in app.jsx shows <LoginPage /> until onAuthStateChanged fires.
  -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>

  <!-- Environment (.env → window.LT_ENV) — must load before utils.jsx -->
  <script src="env.js.php"></script>

  <!-- Shared utilities (API, icons, formatters) -->
  <script type="text/babel" src="utils.jsx"></script>

  <!-- Components -->
  <script type="text/babel" src="components/LoginPage.jsx"></script>
  <script type="text/babel" src="components/HomeSidebar.jsx"></script>
  <script type="text/babel" src="components/CasesHome.jsx"></script>
  <script type="text/babel" src="components/ClientsHome.jsx"></script>
  <script type="text/babel" src="components/AccountHome.jsx"></script>
  <script type="text/babel" src="components/Sidebar.jsx"></script>
  <script type="text/babel" src="components/ChatArea.jsx"></script>
  <script type="text/babel" src="components/DocEditViewer.jsx"></script>
  <script type="text/babel" src="components/DocsPanel.jsx"></script>
  <script type="text/babel" src="components/AnalyzePanel.jsx"></script>
  <script type="text/babel" src="components/ClientsPanel.jsx"></script>
  <script type="text/babel" src="components/BillingPanel.jsx"></script>
  <script type="text/babel" src="components/HearingsPanel.jsx"></script>
  <script type="text/babel" src="components/TeamPanel.jsx"></script>
  <script type="text/babel" src="components/InviteToChatModal.jsx"></script>
  <script type="text/babel" src="components/DocumentEditor.jsx"></script>

  <!-- Root App + mount -->
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
